<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Search</title>
    <style>
        body { font-family: Arial; }
        input {
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 12px;
            font-size: 16px;
            margin-left: 5px;
        }
        .card {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            text-align: center;
            border-radius: 8px;
        }
        img { height: 100px; }
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            padding: 10px;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            max-height: 150px;
            object-fit: contain;
        }
        #cart {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 260px;
            max-height: 80vh;
            overflow-y: auto;

            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            box-sizing: border-box;
        }

        #selectedList {
            margin-top: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between; /* pushes left/right apart */
            align-items: center;
            gap: 8px;

            border-bottom: 1px solid #eee;
            padding: 6px 0;
            font-size: 14px;
        }

        .cart-text {
            flex: 1;
            min-width: 0;          
            white-space: normal;        
            word-break: break-word;     
        }

        .cart-actions {
            display: flex;
            gap: 4px;
        }
        .cart-actions button {
            flex-shrink: 0;
        }
        .card-name {
            font-weight: bold;
        }
        
        .card-meta {
            font-size: 13px;
            opacity: 0.8;
        }

        #tabs {
            display: flex;
            margin-bottom: 10px;
        }

        #tabs button {
            flex: 1;
            padding: 10px;
            border: 1px solid #555;
            cursor: pointer;
        }

        #tabs button.activeTab {
            font-weight: bold;
            border-bottom: none;
        }
        #inventoryTable {
            width: 100%;
            border-collapse: collapse;
        }

        #inventoryTable th,
        #inventoryTable td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        #inventoryTable th {
            background: #eee;
            text-align: left;
        }

        #inventoryTable td:nth-child(n+4) {
            text-align: right;
        }
        #transactionPanel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;

        max-height: 45vh;
        overflow-y: auto;

        background: white;
        border-top: 2px solid #ccc;
        }

        .segmented-control {
            display: flex;
            width: 100%;
            max-width: 450px;
            margin: 10px auto;
            border: 1px solid #888;
            border-radius: 8px;
            overflow: hidden;
        }

        .segmented-control label {
            flex: 1;
            text-align: center;
            cursor: pointer;
        }

        .segmented-control input {
            display: none;
        }

        .segmented-control span {
            display: block;
            padding: 10px 12px;
        }

        .segmented-control input:checked + span {
            background: #555;
            color: white;
        }

        .segmented-control label:not(:last-child) span {
            border-right: 1px solid #888;
        }

        @media (max-width: 600px) {
            body {
                padding-bottom: 45vh; /* adjust to cart height */
            }
            #cart {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0 !important;
                top: auto !important;
                
                width: 100%;
                max-height: 40vh;

                border-radius: 12px 12px 0 0;
                border-top: 1px solid #ccc;

                overflow-y: auto;
                z-index: 1000;
            }
            #results {
                display: flex !important;
                flex-direction: column;
                gap: 10px;
            }
            .card {
                width: 100%;
                margin-bottom: 10px;
            }
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #ffffff;
            }

            .card {
                background-color: #1e1e1e;
                border: 1px solid #444;
            }

            input, button {
                background-color: #2a2a2a;
                color: #ffffff;
                border: 1px solid #555;
            }
            #cart {
                background-color: #1e1e1e;
                color: #ffffff;
                border: 1px solid #444;
            }

            .cart-item {
                border-bottom: 1px solid #444;
            }

            button {
                background-color: #2a2a2a;
                color: #ffffff;
                border: 1px solid #555;
            }
            #transactionPanel {
                background: #2a2a2a;
                border-top: 2px solid #555;
            }
            #transactionFooter {
                border-top: 1px solid #888;
                padding: 12px;
                margin-top: 8px;
            }

            #totals {
                display: grid;
                gap: 4px;
                margin-bottom: 12px;
            }

            #saveTransactionButton {
                width: 100%;
                padding: 10px;
                font-size: 1rem;
                border-radius: 6px;
                cursor: pointer;
            }
            .set-name {color: #bbb;}
        }
    </style>
</head>
<body>

<div id="tabs">
    <button id="searchTab" class="activeTab">
        Search
    </button>

    <button id="inventoryTab">
        Inventory
    </button>
</div>

<div id="searchView">

    <div id="transactionTypeControl" class="segmented-control">

        <label>
            <input
                type="radio"
                name="transactionType"
                value="BUY"
                checked
                onchange="updateTransactionUI()">
            <span>Buy</span>
        </label>

        <label>
            <input
                type="radio"
                name="transactionType"
                value="SELL"
                onchange="updateTransactionUI()">
            <span>Sell</span>
        </label>

        <label>
            <input
                type="radio"
                name="transactionType"
                value="TRADE"
                onchange="updateTransactionUI()">
            <span>Trade</span>
        </label>

    </div>

        <div id="cash_received_row" style="display:none;">
            Cash Received:
            <input type="number" id="cash_received" min="0" step="1" value="0">
        </div>

        <div id="cash_paid_row">
            Cash Paid:
            <input type="number" id="cash_paid" min="0" step="1" value="0">
        </div>
    </div>

    <input type="text" id="search" placeholder="Search..." />

    <button id="searchBtn">Search</button>
    <div id="searchResults"></div>
    <div id="transactionPanel">
        <div id="transactionHeader">
            <strong>Transaction</strong>
        </div>

        <div id="incomingPanel">
            <h3>Incoming Cards</h3>
            <div id="incomingCards"></div>
        </div>

        <div id="outgoingPanel">
            <h3>Outgoing Cards</h3>
            <div id="outgoingCards"></div>
        </div>
        <div id="transactionFooter">

            <div id="totals">
            </div>

            <button id="saveTransactionButton">
                Save Transaction
            </button>

        </div>
    </div>
    
</div>

<div id="inventoryView" style="display:none;">

    <h2>Inventory</h2>

    <table id="inventoryTable">
        <thead>
            <tr>
                <th>Card</th>
                <th>Set</th>
                <th>Condition</th>
                <th>Market (now)</th>
                <th>Paid</th>
                <th>Profit</th>
                <th>Market (then)</th>
            </tr>
        </thead>

        <tbody id="inventoryBody">
        </tbody>
    </table>

</div>

<!--<button id="clearBtn">Clear All</button>-->
<script src="TCG_Grid_app.js"></script>

</body>
</html>
